<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PingMe Weather</title>
    <link rel="stylesheet" href="../../css/pages/weather.css" />
</head>

<body>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-spinner"></div>
        <p>Checking authentication...</p>
    </div>
    
    <div class="app-container">
        <!-- Sidebar = Saved locations -->
        <div class="location-sidebar">
            <div class="sidebar-header">
                <h2>Locations</h2>
                <button id="newLocationButton" class="new-location-button">
                    <img src="../../assets/plus.svg" alt="Add" width="16" height="16">
                </button>
            </div>
            <div id="locationList" class="location-list">
                <!-- Locations populated by JS -->
            </div>
            <div class="sidebar-footer">
                <nav class="bottom-menu">
                    <a href="../chats/chats.html" class="menu-item" data-page="chats">
                        <img src="../../assets/message-circle.svg" alt="Chats" class="menu-icon">
                        <span class="label">Chats</span>
                    </a>
                    <a href="../news/news.html" class="menu-item" data-page="news">
                        <img src="../../assets/file-text.svg" class="menu-icon" alt="News">
                        <span class="label">News</span>
                    </a>
                    <a class="menu-item active" data-page="weather">
                        <img src="../../assets/sun.svg" class="menu-icon" alt="Weather">
                        <span class="label">Weather</span>
                    </a>
                    <a href="../profile/profile.html" class="menu-item" data-page="profile">
                        <img src="../../assets/user.svg" class="menu-icon" alt="Profile">
                        <span class="label">Profile</span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- Main area -->
        <div class="location-main">
            <div id="noLocationSelected" class="no-location-selected">
                <h3>No location selected</h3>
                <p>Select or add a location to view weather</p>
                Powered by <a href="https://www.weatherapi.com/" title="Free Weather API">WeatherAPI.com</a>
            </div>

            <div id="weatherContainer" class="location-container" style="display: none;">
                <div class="location-header">
                    <button id="backButton" class="back-button">
                        <img src="../../assets/arrow-left.svg" alt="Back" width="16" height="16">
                    </button>
                    <div class="location-info">
                        <h2 id="locationTitle">LOADING...</h2>
                        <span id="lastUpdated"></span>
                    </div>
                    <button id="refreshButton" class="refresh-button">
                        <img src="../../assets/refresh.svg" alt="Refresh" width="20" height="20">
                    </button>
                </div>

                <div id="weatherContent" class="weather-content">
                    <!-- Current Weather -->
                    <div id="currentWeather" class="weather-current-section">
                        <div class="weather-card">
                            <div class="current-weather">
                                <div class="temp-display">
                                    <span id="currentTemp">--</span>
                                    <span id="currentUnit">°C</span>
                                </div>
                                <div id="currentCondition">--</div>
                            </div>
                            <div class="weather-icon">
                                <img id="currentIcon" src="" alt="Weather icon">
                            </div>
                            <div class="current-details">
                                <div class="detail-item">
                                    <span class="detail-value" id="feelsLike">--</span>
                                    <span class="detail-label">Feels like</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-value" id="humidity">--</span>
                                    <span class="detail-label">Humidity</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-value" id="windSpeed">--</span>
                                    <span class="detail-label">Wind</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-value" id="precipitation">--</span>
                                    <span class="detail-label">Precip</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Forecast Section -->
                    <div id="forecastSection" class="weather-forecast-section">
                        <h3 class="forecast-title">24h Forecast</h3>
                        <div id="forecastList" class="forecast-list">
                            <!-- Forecast items populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Location Modal -->
        <div id="newLocationModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add Location</h3>
                    <button id="closeModal" class="close-button">✕</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="locationInput" class="search-input" placeholder="Enter city name...">
                </div>
                <div class="modal-footer">
                    <button id="saveLocationBtn" class="button-primary" disabled>Save Location</button>
                    <button id="cancelLocationBtn" class="button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/pages/weather.js"></script>
</body>
</html>
