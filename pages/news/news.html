<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PingMe News</title>
    <link rel="stylesheet" href="../../css/pages/news.css" />
</head>

<body>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-spinner"></div>
        <p>Checking authentication...</p>
    </div>
    
    <div class="app-container">
        <!-- Sidebar = Saved searches -->
        <div class="location-sidebar">
            <div class="sidebar-header">
                <h2>Searches</h2>
                <button id="newSearchButton" class="new-location-button">
                    <img src="../../assets/plus.svg" alt="Add" width="16" height="16">
                </button>
            </div>
            <div id="searchList" class="location-list">
            </div>
            <div class="sidebar-footer">
                <nav class="bottom-menu">
                    <a href="../chats/chats.html" class="menu-item" data-page="chats">
                        <img src="../../assets/message-circle.svg" alt="Chats" class="menu-icon">
                        <span class="label">Chats</span>
                    </a>
                    <a class="menu-item active" data-page="news">
                        <img src="../../assets/file-text.svg" class="menu-icon" alt="News">
                        <span class="label">News</span>
                    </a>
                    <a href="../weather/weather.html" class="menu-item" data-page="weather">
                        <img src="../../assets/sun.svg" class="menu-icon" alt="Weather">
                        <span class="label">Weather</span>
                    </a>
                    <a href="../profile/profile.html" class="menu-item" data-page="profile">
                        <img src="../../assets/user.svg" class="menu-icon" alt="Profile">
                        <span class="label">Profile</span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- Main area -->
        <div class="location-main">
            <div id="noSearchSelected" class="no-location-selected">
                <h3>No search selected</h3>
                <p>Select or add a search to view news articles</p>
                Powered by <a href="https://newsapi.org/" title="News API">NewsAPI.org</a>
            </div>

            <div id="newsContainer" class="location-container" style="display: none;">
                <div class="location-header">
                    <button id="backButton" class="back-button">
                        <img src="../../assets/arrow-left.svg" alt="Back" width="16" height="16">
                    </button>
                    <div class="location-info">
                        <h2 id="searchTitle">LOADING...</h2>
                        <span id="lastUpdated"></span>
                    </div>
                    <button id="refreshButton" class="refresh-button">
                        <img src="../../assets/refresh.svg" alt="Refresh" width="20" height="20">
                    </button>
                </div>

                <div id="newsContent" class="news-content">
                    <div class="news-articles-section">
                        <h3 class="section-title">Recent Articles</h3>
                        <div id="articlesList" class="articles-list">
                        </div>
                    </div>

                    <!-- <div class="news-preview-section">
                        <h3 class="section-title">Search Info</h3>
                        <div id="searchInfo" class="search-info">
                        </div>
                    </div> -->
                </div>
            </div>
        </div>

        <div id="newSearchModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add Search</h3>
                    <button id="closeModal" class="close-button">✕</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="searchInput" class="search-input" placeholder="Enter search term (e.g. AI, Bitcoin, Sports)...">
                </div>
                <div class="modal-footer">
                    <button id="saveSearchBtn" class="button-primary" disabled>Save Search</button>
                    <button id="cancelSearchBtn" class="button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../js/pages/news.js"></script>
</body>
</html>
