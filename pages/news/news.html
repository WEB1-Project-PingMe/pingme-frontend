<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PingMe News</title>
    <link rel="stylesheet" href="../../css/pages/news.css" />
</head>

<body>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-spinner"></div>
        <p>Checking authentication...</p>
    </div>
    <div class="app-container">
        <div class="news-sidebar">
            <div class="sidebar-header">
                <h2>News</h2>
                <button id="newNewsButton" class="new-news-button">
                    <img src="../../assets/plus.svg" alt="Add" width="16" height="16">
                </button>
            </div>
            <div id="newsList" class="news-list"></div>

            <div class="sidebar-footer">
                <nav class="bottom-menu">
                    <a href="../chats/chats.html" class="menu-item" data-page="chats">
                        <img src="../../assets/message-circle.svg" alt="Profile" class="menu-icon">
                        <span class="label">Chats</span>
                    </a>
                    <a class="menu-item active" data-page="news">
                        <img src="../../assets/file-text.svg" class="menu-icon" alt="News">
                        <span class="label">News</span>
                    </a>
                    <a href="../weather/weather.html" class="menu-item" data-page="weather">
                        <img src="../../assets/sun.svg" class="menu-icon" alt="Weather">
                        <span class="label">Weather</span>
                    </a>
                    <a href="../profile/profile.html" class="menu-item" data-page="profile">
                        <img src="../../assets/user.svg" class="menu-icon" alt="Profile">
                        <span class="label">Profile</span>
                    </a>
                </nav>
            </div>
        </div>

        <!-- Main area -->
        <div class="news-main">
            <div id="noNewsSelected" class="no-news-selected">
                <h3>No News Source selected</h3>
                <p>Select or add a new Source to view News</p>
            </div>

            <div id="newsContainer" class="news-container" style="display: none;">
                <div class="news-header">
                    <button id="backButton" class="back-button">
                        <img src="../../assets/arrow-left.svg" alt="Back" width="16" height="16">
                    </button>
                    <div class="news-info">
                        <h2 id="newsTitle">LOADING??</h2>
                        <span id="lastUpdated"></span>
                    </div>
                    <button id="refreshButton" class="new-news-button">Update</button>
                </div>
                <div id="newsContent" class="messages"></div>
            </div>
        </div>

        <div id="newNewsModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add News <Source></Source></h3>
                    <button id="closeModal" class="close-button">✕</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="newsInput" class="search-input" placeholder="Enter city name...">
                </div>
                <div class="modal-footer">
                    <button id="saveNewsBtn" class="button-primary" disabled>Save News</button>
                    <button id="cancelNewsBtn" class="button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../../js/pages/news.js"></script>
</body>

</html>
