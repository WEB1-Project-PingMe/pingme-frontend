<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Messenger</title>
    <!-- <link rel="stylesheet" href="../../css/base.css"> -->
    <link rel="stylesheet" href="../../css/pages/chats.css">
</head>

<body>
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-spinner"></div>
        <p>Checking authentication...</p>
    </div>
    <div class="app-container">
        <!-- Chat List -->
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <button id="newChatButton" class="new-chat-button">
                    <img src="../../assets/plus.svg" alt="Close" width="16" height="16">
                </button>
            </div>
            <div id="chatList" class="chat-list"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-main">
            <div id="noChatSelected" class="no-chat-selected">
                <h3>Select a chat</h3>
                <p>Choose from your recent conversations</p>
            </div>

            <div id="chatContainer" class="chat-container" style="display: none;">
                <div class="chat-header">
                    <button id="backButton" class="back-button">
                        <img src="../../assets/arrow-left.svg" alt="Close" width="16" height="16">
                    </button>
                    <div class="chat-info">
                        <h2 id="chatTitle"></h2>
                        <span id="chatLastTime"></span>
                    </div>
                </div>
                <div id="messages" class="messages"></div>
                <div class="chat-input-container" id="chatInputContainer">
                    <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500">
                    <button id="sendButton">
                        <img src="../../assets/send.svg" alt="Close" width="16" height="16">
                    </button>
                </div>
            </div>
        </div>

        <!-- Create New Chat -->
        <div id="newChatModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">New Chat</h3>
                    <button id="closeModalButton" class="close-button">
                        <img src="../../assets/x.svg" alt="Close" width="16" height="16">
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Type selector -->
                    <div class="chat-type-selector">
                        <label class="type-option active" data-type="direct">
                            <input type="radio" name="chatType" value="direct" checked>
                            <span>1:1 Chat</span>
                        </label>
                        <label class="type-option" data-type="group">
                            <input type="radio" name="chatType" value="group">
                            <span>Group Chat</span>
                        </label>
                    </div>

                    <!-- Dynamic content based on type -->
                    <div id="directContent">
                        <input type="text" id="participantSearch" placeholder="Search users..." class="search-input">
                        <div id="userList" class="user-list"></div>
                    </div>
                    <div id="groupContent" style="display: none;">
                        <input type="text" id="groupNameInput" placeholder="Group name" class="search-input"
                            maxlength="50">
                        <input type="text" id="groupMemberSearch" placeholder="Search members..." class="search-input">
                        <div id="groupMemberList" class="user-list"></div>
                        <div id="selectedMembers" class="selected-members"></div>
                    </div>
                    <p class="no-users">No users found</p>
                </div>
                <div class="modal-footer">
                    <button id="createChatButton" class="button-primary" disabled>Create</button>
                    <button id="cancelNewChat" class="button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <script src="../../js/pages/chats.js"></script>
</body>

</html>
