<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>
    <!-- <link rel="stylesheet" href="../../css/base.css"> -->
    <link rel="stylesheet" href="../../css/pages/chats.css">
</head>

<body>
    <div class="app-container">
        <!-- Chat List -->
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <button id="newChatButton" class="new-chat-button">+</button>
            </div>
            <div id="chatList" class="chat-list"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-main">
            <div id="noChatSelected" class="no-chat-selected">
                <h3>Select a chat</h3>
                <p>Choose from your recent conversations</p>
            </div>

            <div id="chatContainer" class="chat-container" style="display: none;">
                <div class="chat-header">
                    <button id="backButton" class="back-button">←</button>
                    <div class="chat-info">
                        <h2 id="chatTitle"></h2>
                        <span id="chatLastTime"></span>
                    </div>
                </div>
                <div id="messages" class="messages"></div>
                <div class="chat-input-container">
                    <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500">
                    <button id="sendButton"></button>
                </div>
            </div>
        </div>

        <!-- Create New Chat -->
        <div id="newChatModal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>New Chat</h3>
                    <button id="closeModalButton" class="close-button">×</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="participantSearch" placeholder="Search users..." class="search-input">
                    <div id="userList" class="user-list"></div>
                    <p class="no-users">No users found</p>
                </div>
                <div class="modal-footer">
                    <button id="cancelNewChat" class="button-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <script src="../../js/pages/chats.js"></script>
</body>

</html>
